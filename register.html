<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Form Register</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="page-wrap">
			<section class="card">
				<h1 class="title">Daftar Akun</h1>

				<form id="registerForm" novalidate>
					<div class="field">
						<label for="name">Nama</label>
						<input type="text" id="name" name="name" placeholder="Nama lengkap" required />
						<small class="error" data-for="name"></small>
					</div>

					<div class="field">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" placeholder="email@domain.com" required />
						<small class="error" data-for="email"></small>
					</div>

					<div class="field">
						<label for="password">Password</label>
						<div class="password-row">
							<input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required minlength="6" />
							<button type="button" id="togglePwd" aria-label="Tampilkan password">Show</button>
						</div>
						<small class="hint">Gunakan kombinasi huruf dan angka.</small>
						<small class="error" data-for="password"></small>
						<div class="strength" aria-hidden="true"><span></span></div>
					</div>

					<button class="btn" type="submit">Daftar</button>

					<div id="formMessage" role="status" aria-live="polite"></div>
				</form>
			</section>
		</main>

		<script src="scripts.js"></script>
	</body>
</html>
